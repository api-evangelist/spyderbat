domain_standards:
  sector: cybersecurity / cloud detection and response
  note: >-
    Reward-only. Spyderbat's market has real interchange standards, and the contract
    declares one of them plainly while the others are absent.
  standards:
  - id: mitre-attack
    conforms: true
    evidence: >-
      Red flags carry MITRE ATT&CK tactic and technique identifiers. The MCP
      documentation shows detections labelled TA0004.T1548 (root_shell), TA0008.T1021
      (ssh_inside_container_detection) and TA0005.T1610 (nonk8s_container_detection) —
      the standard technique taxonomy for this sector, present in the returned data rather
      than only claimed in marketing copy.
    location: event_redflag search schema; https://docs.spyderbat.com/installation/mcp.md
  - id: ocsf
    conforms: false
    evidence: >-
      No Open Cybersecurity Schema Framework class_uid, category_uid or activity_id
      appears in any of the 226 schemas or in the search-field reference. Forwarded SIEM
      events are Spyderbat-native schema objects (model_spydertrace, model_connection,
      event_redflag), so a SIEM consumer needs a Spyderbat-specific connector rather than
      an OCSF one.
  - id: stix-taxii
    conforms: false
    evidence: No STIX bundle or TAXII endpoint is exposed or documented.
  - id: cyclonedx-spdx
    conforms: false
    evidence: No SBOM format is produced or consumed by the published API.
  - id: cve-cvss
    conforms: false
    evidence: >-
      No CVE identifier or CVSS vector field appears in the contract. Spyderbat's
      detection model is behavioral/runtime rather than vulnerability-scanner shaped, so
      this is an absence of applicability rather than a gap.
  - id: falco-rules
    conforms: partial
    evidence: >-
      Not in the API contract, but Spyderbat publishes github.com/spyderbat/rules ("Falco
      rule repository") and github.com/spyderbat/falcosidekick, and documents a Falco
      connector deployment at
      https://docs.spyderbat.com/tutorials/integrations/falco-connector-deployment. The
      interop is at the integration layer, not in the REST contract.
  - id: syslog-rfc5424
    conforms: partial
    evidence: >-
      The Event Forwarder writes to syslog as one of its four destinations (file, webhook,
      stdout, syslog) per
      https://docs.spyderbat.com/concepts/integrations/siem-forwarding.md. The syslog
      profile itself is not specified in the docs.
