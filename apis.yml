apis:
- aid: spyderbat:spyderbat-api
  name: Spyderbat API
  description: >-
    The Spyderbat public REST API — the same surface the Spyderbat console is built on.
    197 operations across 30 resource groups cover organizations and RBAC, sources and
    agents, agent registration and agent work, adhoc and saved search, search sets,
    investigations and cases, analytics policies and rulesets, custom flags, watchlists,
    suppression, notification targets, templates and configurations, agent-health
    notifications, forwarded events for SIEM integration, fingerprint data, archives and
    the spyctl resource surface. Authenticated with a bearer API key (JWT) bound to a user
    account and its organization role.
