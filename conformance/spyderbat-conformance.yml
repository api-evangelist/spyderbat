standards:
- id: openapi-3.0
  conforms: true
  evidence: >-
    openapi/spyderbat-openapi.json declares `openapi: 3.0.1` with 153 paths, 197
    operations and 226 component schemas; served live at
    https://api.spyderbat.com/openapi.json (HTTP 200).
- id: rfc6750-bearer
  conforms: true
  evidence: >-
    components.securitySchemes.apiToken is `type: http, scheme: bearer, bearerFormat: JWT`,
    applied globally via top-level `security: [{apiToken: []}]`. Docs confirm the header
    form `Authorization: Bearer <api-key>`.
- id: oauth2
  conforms: false
  evidence: >-
    No oauth2 securityScheme in the contract; /.well-known/oauth-authorization-server and
