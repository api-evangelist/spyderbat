aid: spyderbat
name: Spyderbat
description: >-
  Spyderbat is an Austin, Texas cloud-native runtime security company whose platform
  delivers cloud detection and response (CDR) for Linux servers, containers and Kubernetes.
  A lightweight eBPF-based Nano Agent captures kernel-level process, connection, container
  and Kubernetes activity and streams it into Spyderbat's causal-graph backend, where
  Spydertraces link related processes, network connections and red flags into scored,
  attack-path units that analysts can replay at any point in the past. The platform spans
  Scout (behavioral detection and custom flags), Flashback (time-travel investigations),
  Guardian (workload and ruleset policies that lock down critical workloads), suppression,
  notifications, dashboards and SIEM forwarding. Everything the console does is backed by
  a public REST API at api.prod.spyderbat.com, documented by a published OpenAPI 3.0.1
  contract of 197 operations across 30 resource groups, authenticated with a bearer API
  key bound to an RBAC role. Spyderbat also ships a remote Model Context Protocol server,
  the open-source spyctl CLI, spydertop, and an event forwarder for SIEM integration.
