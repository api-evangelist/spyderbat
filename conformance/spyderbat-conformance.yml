    documentation states explicitly that "OAuth is not currently supported".
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on every Spyderbat host.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    No application/problem+json media type appears anywhere in the contract. Only 400
    declares a JSON body (ValidationError); 403/404/409/422/429 declare no schema.
- id: pagination
  conforms: partial
  evidence: >-
