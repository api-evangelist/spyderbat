search_object_model:
  note: >-
    The security data an analyst actually queries is NOT modelled as REST resources — it
    lives behind the adhoc search surface as named schemas, documented at
    https://docs.spyderbat.com/reference/search/search-fields. The REST contract exposes
    them only as opaque search results.
  schemas:
  - name: model_spydertrace
    description: >-
      A scored causal unit bundling related processes, connections and red flags into one
      attack path. Carries a `score`; the MCP docs use `score > 50` as a triage threshold.
  - name: model_connection
    description: A network connection, searchable by IP, resolving to pod_uid / node.
  - name: event_redflag
    description: >-
      A detection with `severity` and a MITRE ATT&CK mapping (for example TA0004.T1548
      root_shell), plus a score.
  cross_entity_ids:
  - pod_uid
  - ppuid
  - containerID
  - imageID
  - machineUID
  - cluster_name
  - namespace
  note: >-
    `ppuid` is the parent-process link the docs use to walk a process tree; `pod_uid`
    resolves through get_objects / Objects into pod name, namespace and node.
