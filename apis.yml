x-pointers-not-emitted:
  note: >-
    Recorded deliberately so a later pass does not re-hunt them. Each was probed and is
    genuinely absent from Spyderbat's public surface; emitting the pointer would be a
    false claim made on the provider's behalf.
  absent:
  - type: WellKnown
    reason: >-
      Every /.well-known/* path 404s on api.spyderbat.com, spyderbat.com and
      docs.spyderbat.com; app.spyderbat.com returns the console SPA shell with HTTP 200
      for every path, which is not a document. See well-known/spyderbat-well-known.yml.
  - type: SecurityTxt
    reason: 'spyderbat.com/.well-known/security.txt returns 404 {"message":"security.txt not found"}.'
  - type: AgentCard
    reason: /.well-known/agent-card.json and /.well-known/agent.json 404 on every real host.
  - type: Idempotency
    reason: >-
      No Idempotency-Key header or idempotency parameter exists in the contract or the
      docs, including on the three irreversible agent response actions.
  - type: SDKs
    reason: >-
      Spyderbat publishes first-party PACKAGES (spyctl, spydertop, event-forwarder) but no
      client SDK library in any language. Packages is emitted; SDKs is not.
  - type: StatusPage
    reason: status.spyderbat.com does not resolve and no status page exists.
  - type: Deprecation
    reason: No deprecation or sunset policy is published and no operation is marked deprecated.
  - type: Security
    reason: >-
      No security.txt, vulnerability disclosure policy or bug bounty program was found on
      any Spyderbat host.
  - type: Compliance
    reason: >-
      No SOC 2, ISO 27001, PCI, HIPAA or FedRAMP claim appears on the site, in the docs or
      in the contract.
  - type: TrustCenter
    reason: trust.spyderbat.com does not resolve and spyderbat.com/security 404s.
  - type: AsyncAPI
    reason: >-
      No AsyncAPI document is published. A real event surface exists and is captured under
      type Webhooks instead.
  - type: TermsOfService
    reason: >-
      The OpenAPI declares info.termsOfService https://www.spyderbat.com/terms-of-use/,
      which returns 404, and no terms page exists elsewhere on the site.
  - type: Pricing
    reason: spyderbat.com/pricing returns 404 and the site carries no pricing link.
  - type: Roadmap
    reason: spyderbat.com/roadmap and docs.spyderbat.com/roadmap both 404.
  - type: Postman
    reason: The Postman public search API returns zero results for "spyderbat".
  - type: Sandbox
    reason: >-
      No test/live key modes, no sandbox environment and no test fixtures are published.
      The API reference viewer is ReDoc, which has no try-it console.
  - type: Protobuf
    reason: No .proto is published in the GitHub org or referenced in the docs.
  - type: WSDL
    reason: '?wsdl returns 404 on api.spyderbat.com and api.prod.spyderbat.com.'
  - type: GraphQL
    reason: No /graphql surface exists on any host and none is documented.
  - type: OAuthScopes
    reason: >-
      Bearer-JWT key auth with RBAC roles; the contract declares no oauth2 securityScheme,
      so there is no scope surface. Authorization is carried by authentication/ instead.
  - type: DeclineCodes
    reason: Not a payments or authorization provider.
